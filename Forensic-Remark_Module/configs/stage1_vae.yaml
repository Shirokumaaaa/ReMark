model:
  base_channels: 32
  latent_channels: 64
  downsample_factor: 16          # 128x128 → 8x8 latent

training:
  epochs: 200
  batch_size: 16
  lr: 3.0e-4
  betas: [0.9, 0.999]
  weight_decay: 1.0e-4
  kl_warmup_epochs: 10
  save_freq: 10
  val_freq: 1

slerp:
  n_steps: 10

losses:
  l1:    { weight: 1.0 }
  lpips: { weight: 0.1 }
  bce:   { weight: 5.0 }
  kl:    { weight: 1.0e-4, warmup: true }

efficiency:
  cache_wm_images: false
  use_amp: true
  wm_loss_freq: 1
  attack_num_workers: 2

wm_model: fin

attacks:
  online:  [stargan]
  offline: []

data:
  train_csv: data_manifests/celeba_hq_128_train.csv
  val_csv:   data_manifests/celeba_hq_128_val.csv
  image_size: 128

paths:
  runs_dir: runs
