# fake2fake 快测（SimSwap）：Residual VAE + deterministic latent + 轻量 BCE

model:
  deterministic_latent: true
  residual_output: true
  residual_scale: 0.5

training:
  epochs: 30
  batch_size: 8
  lr: 3.0e-4
  kl_warmup_epochs: 20
  save_freq: 10
  val_freq: 1

losses:
  l1:    { weight: 1.0 }
  lpips: { weight: 0.0, enabled: false }
  bce:   { weight: 0.3 }
  kl:    { weight: 0, target_weight: 0.0, warmup: false }

attacks:
  online:  [simswap]
  offline: []

attack_options:
  enforce_nontrivial_swap: true
  nontrivial_swap_eps: 1.0e-4

alternating_train:
  enabled: true
  warmup_epochs: 3
  warmup_prob: 0.20
  mid_start_epoch: 8
  mid_prob: 0.35
  late_start_epoch: 20
  main_prob: 0.50
  late_prob: 0.45

data:
  train_csv: data_manifests/local_celeba_hq_128_tiny_train.csv
  val_csv:   data_manifests/local_celeba_hq_128_tiny_val.csv

preflight_eval:
  enabled: true
  max_batches: 8
  save_csv: true
