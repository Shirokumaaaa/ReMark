model:
  base_channels: 24
  latent_channels: 48
  downsample_factor: 8
  n_res: 2
  deterministic_latent: true
  residual_output: true
  residual_scale: 0.5

training:
  epochs: 1
  batch_size: 4
  lr: 3.0e-4
  kl_warmup_epochs: 20
  save_freq: 1
  val_freq: 1

validation:
  max_batches: 1

losses:
  l1:    { weight: 1.0 }
  lpips: { weight: 0.0, enabled: false }
  bce:   { weight: 1.0 }
  kl:    { weight: 0, target_weight: 0.001, warmup: false }

attacks:
  online: [simswap, stargan]
  offline: []

attack_options:
  enforce_nontrivial_swap: true
  nontrivial_swap_eps: 1.0e-4

alternating_train:
  enabled: true
  warmup_epochs: 0
  warmup_prob: 1.0
  mid_start_epoch: 1
  mid_prob: 1.0
  late_start_epoch: 2
  main_prob: 1.0
  late_prob: 1.0

data:
  train_csv: data_manifests/local_celeba_hq_128_tiny_train.csv
  val_csv: data_manifests/local_celeba_hq_128_tiny_val.csv

preflight_eval:
  enabled: true
  max_batches: 1
  save_csv: false
