# fake2fake 快测（Arc2Face replay）：Residual VAE + deterministic latent + 轻量 BCE

model:
  deterministic_latent: true
  residual_output: true
  residual_scale: 0.5

training:
  epochs: 30
  batch_size: 4
  lr: 3.0e-4
  kl_warmup_epochs: 20
  save_freq: 10
  val_freq: 1

losses:
  l1:    { weight: 1.0 }
  lpips: { weight: 0.0, enabled: false }
  bce:   { weight: 0.3 }
  kl:    { weight: 0, target_weight: 0.0, warmup: false }

attacks:
  online:  [Arc2Face]
  offline: []

attack_options:
  arc2face_results_jsonl: /mnt/personal_workspace/chenkeyu/ReMark/Attack-arc2face_wrapper/outputs/generation_results.jsonl
  arc2face_outputs_base: /mnt/personal_workspace/chenkeyu/ReMark/Attack-arc2face_wrapper
  arc2face_replay_key: source_image
  arc2face_allow_missing: false
  enforce_nontrivial_swap: true
  nontrivial_swap_eps: 1.0e-4

alternating_train:
  enabled: true
  warmup_epochs: 3
  warmup_prob: 0.20
  mid_start_epoch: 8
  mid_prob: 0.35
  late_start_epoch: 20
  main_prob: 0.50
  late_prob: 0.45

data:
  # Arc2Face replay key 依赖 source_image 路径，使用 tiny_val 保证全部命中。
  train_csv: data_manifests/celeba_hq_128_tiny_val.csv
  val_csv:   data_manifests/celeba_hq_128_tiny_val.csv

preflight_eval:
  enabled: true
  max_batches: 8
  save_csv: true
