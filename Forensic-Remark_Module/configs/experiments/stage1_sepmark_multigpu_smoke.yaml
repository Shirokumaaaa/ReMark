wm_model: sepmark

wm_adapter_sepmark:
  image_size: 256
  message_length: 128
  message_range: 0.1
  attention_encoder: se
  attention_decoder: se
  decoder_head: c

training:
  epochs: 1
  batch_size: 8
  val_freq: 1
  save_freq: 1

preflight_eval:
  enabled: true
  max_batches: 2
  save_csv: true

efficiency:
  cache_wm_images: false
  use_amp: false
  wm_loss_freq: 1
  attack_num_workers: 0

attacks:
  online: [stargan]
  offline: []

data:
  train_csv: data_manifests/celeba_hq_128_tiny.csv
  val_csv: data_manifests/celeba_hq_128_tiny_val.csv
  image_size: 128
