model:
  deterministic_latent: true
  residual_output: true
  residual_scale: 0.5
training:
  epochs: 30
  batch_size: 8
  lr: 0.0003
  kl_warmup_epochs: 20
  save_freq: 10
  val_freq: 1
losses:
  l1:
    weight: 1.0
  lpips:
    weight: 0.0
    enabled: false
  bce:
    weight: 0.5
  kl:
    weight: 0
    target_weight: 0.003
    warmup: false
attacks:
  online:
  - simswap
  offline: []
attack_options:
  enforce_nontrivial_swap: true
  nontrivial_swap_eps: 0.0001
alternating_train:
  enabled: true
  warmup_epochs: 0
  warmup_prob: 1.0
  mid_start_epoch: 1
  mid_prob: 1.0
  late_start_epoch: 2
  main_prob: 1.0
  late_prob: 1.0
data:
  train_csv: data_manifests/local_celeba_hq_128_tiny_train.csv
  val_csv: data_manifests/local_celeba_hq_128_tiny_val.csv
preflight_eval:
  enabled: true
  max_batches: 4
  save_csv: true
