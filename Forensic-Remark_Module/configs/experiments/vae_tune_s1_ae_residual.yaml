# 过拟合能力验证（Residual AE）：deterministic latent + residual output

model:
  deterministic_latent: true
  residual_output: true
  residual_scale: 0.5

training:
  epochs: 80
  batch_size: 8
  lr: 4.0e-4
  kl_warmup_epochs: 20
  save_freq: 10
  val_freq: 1

losses:
  l1:    { weight: 1.0 }
  lpips: { weight: 0.0, enabled: false }
  bce:   { weight: 0.0, enabled: false }
  kl:    { weight: 0, target_weight: 0.0, warmup: false }

attacks:
  online: []
  offline: []

data:
  train_csv: data_manifests/local_celeba_hq_128_tiny_train.csv
  val_csv:   data_manifests/local_celeba_hq_128_tiny_val.csv

preflight_eval:
  enabled: true
  max_batches: 8
  save_csv: true
