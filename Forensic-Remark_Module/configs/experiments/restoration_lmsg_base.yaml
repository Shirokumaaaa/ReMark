training:
  epochs: 20
  batch_size: 8
  lr: 1.0e-4
  betas: [0.9, 0.999]
  weight_decay: 1.0e-4
  kl_warmup_epochs: 0
  save_freq: 5
  val_freq: 1
  best_select: val_attack_avg_acc
  dual_branch_train: false

validation:
  max_batches: 8
  attacks: [stargan2]

progress:
  enabled: true
  log_interval_steps: 20

losses:
  l1:    { weight: 0.5 }
  lpips: { weight: 0.0, enabled: false }
  bce:   { weight: 5.0 }
  kl:    { weight: 0.0, enabled: true }

efficiency:
  cache_wm_images: false
  use_amp: true
  wm_loss_freq: 1
  attack_num_workers: 4

wm_model: lampmark

wm_adapter_lampmark:
  image_size: 128
  message_length: 64
  encoder_ckpt: /mnt/personal_workspace/chenkeyu/ReMark/Forensic-LampMark/weights/128_64/deepfake/encoder_epoch_30.pth
  decoder_ckpt: /mnt/personal_workspace/chenkeyu/ReMark/Forensic-LampMark/weights/128_64/deepfake/decoder_epoch_30.pth
  decoder_logits_mode: linear_centered
  decoder_logits_scale: 10.0

attacks:
  online: [stargan2]
  offline: []
  sample_weights:
    stargan2: 1.0
    identity: 0.25

attack_options:
  enforce_nontrivial_swap: true
  nontrivial_swap_eps: 1.0e-4
  stargan2_ckpt: /mnt/personal_workspace/chenkeyu/ReMark/Attack-StarGAN/modelckpt/200000-G.ckpt
  stargan2_image_size: 256
  stargan2_selected_attrs: [Black_Hair, Blond_Hair, Brown_Hair, Male, Young]
  stargan2_hair_exclusive: false

data:
  train_csv: data_manifests/ffhq_10k_train_with_attrs.csv
  val_csv: data_manifests/ffhq_10k_val_with_attrs.csv
  image_size: 128

paths:
  runs_dir: runs/restoration_lmsg

preflight_eval:
  enabled: true
  max_batches: 2
  attacks: [clean, stargan2]
  save_csv: false
