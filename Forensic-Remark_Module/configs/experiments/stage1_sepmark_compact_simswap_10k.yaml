# Stage1 大规模训练（10k）- cross-attack 架构筛选后固化配置
# 结构来源：arch_cv sweep 结论（compact_24_48 在 StarGAN+Arc2Face 平均最稳）

model:
  base_channels: 24
  latent_channels: 48
  downsample_factor: 8
  n_res: 2
  deterministic_latent: true
  residual_output: true
  residual_scale: 0.5

training:
  epochs: 80
  batch_size: 16
  lr: 3.0e-4
  kl_warmup_epochs: 20
  save_freq: 10
  val_freq: 1

validation:
  max_batches: 8

progress:
  enabled: true
  log_interval_steps: 10

losses:
  l1:    { weight: 1.0 }
  lpips: { weight: 0.0, enabled: false }
  bce:   { weight: 1.0 }
  kl:    { weight: 0, target_weight: 0.001, warmup: false }

attacks:
  online:  [simswap]
  offline: []

attack_options:
  enforce_nontrivial_swap: true
  nontrivial_swap_eps: 1.0e-4

alternating_train:
  enabled: true
  warmup_epochs: 0
  warmup_prob: 1.0
  mid_start_epoch: 1
  mid_prob: 1.0
  late_start_epoch: 2
  main_prob: 1.0
  late_prob: 1.0

data:
  train_csv: data_manifests/celeba_hq_128_train_10k.csv
  val_csv: data_manifests/celeba_hq_128_val.csv

preflight_eval:
  enabled: true
  max_batches: 4
  save_csv: false
