# 生产训练配置：SepMark + Residual VAE + fake2fake identity + 轻量 BCE

model:
  deterministic_latent: true
  residual_output: true
  residual_scale: 0.5

training:
  epochs: 100
  batch_size: 16
  lr: 2.0e-4
  kl_warmup_epochs: 20
  save_freq: 10
  val_freq: 1

losses:
  l1:    { weight: 1.0 }
  lpips: { weight: 0.0, enabled: false }
  bce:   { weight: 0.3 }
  kl:    { weight: 0, target_weight: 0.0, warmup: false }

attacks:
  online:  [stargan]
  offline: []

alternating_train:
  enabled: true
  warmup_epochs: 10
  warmup_prob: 0.20
  mid_start_epoch: 30
  mid_prob: 0.35
  late_start_epoch: 80
  main_prob: 0.50
  late_prob: 0.45

data:
  train_csv: data_manifests/celeba_hq_128_train_10k.csv
  val_csv:   data_manifests/celeba_hq_128_val.csv

preflight_eval:
  enabled: true
  max_batches: 4
  save_csv: true
