model:
  in_channels: 4
  base_channels: 64

training:
  epochs: 200
  batch_size: 16
  lr: 1.0e-5
  betas: [0.9, 0.999]
  save_freq: 10
  val_freq: 1
  max_infer_steps: 10            # 推理时最大迭代步数

losses:
  l1:  { weight: 1.0 }
  bce: { weight: 1.0 }

efficiency:
  use_amp: true
  cache_slerp: true              # epoch 开始前预计算轨迹

wm_model: fin
attacks:
  online:  [stargan]
  offline: []

data:
  train_csv: data_manifests/celeba_hq_128_train.csv
  val_csv:   data_manifests/celeba_hq_128_val.csv
  image_size: 128

paths:
  stage1_checkpoint: checkpoints/stage1/best.pth   # 必须与 Stage1 版本绑定
  checkpoint_dir: checkpoints/stage2
  log_dir:        logging
  sample_dir:     samples/stage2
